name: AMR native codecs

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-amr:
    name: AMR / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    env:
      RFCVOIP_REQUIRE_AMR: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux native libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopencore-amrnb0 libopencore-amrwb0 libvo-amrwbenc0
      - name: Install macOS native libraries
        if: runner.os == 'macOS'
        run: brew install opencore-amr vo-amrwbenc
      - name: Install Windows native libraries
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-opencore-amr
            mingw-w64-ucrt-x86_64-vo-amrwbenc
      - name: Configure Windows library directory
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          "RFCVOIP_AMR_LIBRARY_DIR=$env:MSYS2_LOCATION\ucrt64\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install package and tests
        run: python -m pip install -e . pytest
      - name: Run native codec and signaling tests
        run: python -m pytest tests/test_codecs_amr.py tests/test_amr_library_loading.py tests/test_amr_rtp_native.py tests/test_amr_negotiation.py tests/test_amr_bandwidth.py tests/test_codecs_init_hilevel.py -q
